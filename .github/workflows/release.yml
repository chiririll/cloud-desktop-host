# Push a tag like v0.1.0 → builds the CT bundle and attaches it to a GitHub release.
# One matrix job per distro release builds its binary + bundle (tag fc43, ubuntu2604…); a final job (only if all builds
# succeeded) writes the single MANIFEST + SHA256SUMS and creates the release — no partial releases.
# Asset names carry no version, so .../releases/latest/download/<name> always works.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # keep in sync with SUPPORTED_DISTROS in pve/install-parts/10-config.sh and SUPPORTED_TAGS in pve/install-parts/ct/10-ct-config.sh
        include:
          - { tag: fc43, base: "fedora:43" }
          - { tag: fc44, base: "fedora:44" }
          - { tag: fc45, base: "fedora:45" }
          - { tag: ubuntu2604, base: "ubuntu:26.04" }
    env:
      TAG: ${{ matrix.tag }}
      BASE: ${{ matrix.base }}
    steps:
      - uses: actions/checkout@v4

      - name: Check pve/install.sh and pve/ct-install.sh are built from pve/install-parts
        run: pve/build.sh --check

      - name: Fetch wlroots submodule only
        run: git submodule update --init --depth 1 subprojects/wlroots

      - name: Build binary (${{ env.BASE }}, static wlroots)
        run: docker build --build-arg BASE=$BASE -o dist .

      - name: Package
        run: |
          mkdir -p pkg/cdh/pve dist
          cp dist/cloud-desktop-host pkg/cdh/
          cp -r scripts configs pkg/cdh/
          cp pve/install.sh pve/ct-install.sh pve/host-persist.sh pkg/cdh/pve/
          tar -C pkg -czf dist/cdh-$TAG-x86_64.tar.gz cdh
          mv dist/cloud-desktop-host dist/cloud-desktop-host-$TAG-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.tag }}
          path: dist/*
          if-no-files-found: error

  # runs only if every build succeeded: one MANIFEST, one SHA256SUMS, one release
  release:
    needs: build
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: build-*
          merge-multiple: true

      - name: Checksums
        run: |
          # MANIFEST (used by `ct-install.sh --check`): one binary line per distro, plus the scripts/configs
          # shared by all of them. ct-install.sh picks its own cloud-desktop-host-<tag>-x86_64 line.
          # ct-install.sh itself is a release asset too: install.sh pushes it into the CT when it is not run from a checkout.
          cp pve/ct-install.sh dist/ct-install.sh
          { (cd dist && sha256sum cloud-desktop-host-*-x86_64)
            sha256sum $(find scripts configs -type f | sort)
          } > dist/MANIFEST
          (cd dist && sha256sum cdh-*-x86_64.tar.gz cloud-desktop-host-*-x86_64 ct-install.sh MANIFEST > SHA256SUMS && cat SHA256SUMS)

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
