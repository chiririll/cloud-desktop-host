# Push a tag like v0.1.0 → builds the CT bundle and attaches it to a GitHub release.
# One matrix job per Fedora release; each uploads its own fcNN assets.
# Asset names carry no version, so .../releases/latest/download/<name> always works.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        fedora: ["43", "44", "45"]   # keep in sync with SUPPORTED_FEDORA in pve/install.sh
    env:
      FEDORA: ${{ matrix.fedora }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch wlroots submodule only
        run: git submodule update --init --depth 1 subprojects/wlroots

      - name: Build binary (Fedora ${{ env.FEDORA }}, static wlroots)
        run: docker build --build-arg FEDORA=$FEDORA -o dist .

      - name: Package
        run: |
          B=cdh-fc$FEDORA-x86_64
          mkdir -p pkg/cdh/pve
          cp dist/cloud-desktop-host pkg/cdh/
          cp -r scripts configs pkg/cdh/
          cp pve/install.sh pve/host-persist.sh pkg/cdh/pve/
          tar -C pkg -czf $B.tar.gz cdh
          cp dist/cloud-desktop-host cloud-desktop-host-fc$FEDORA-x86_64
          (cd pkg/cdh && { sha256sum cloud-desktop-host; find scripts configs -type f | sort | xargs sha256sum; }) > MANIFEST-fc$FEDORA
          sha256sum $B.tar.gz cloud-desktop-host-fc$FEDORA-x86_64 MANIFEST-fc$FEDORA > SHA256SUMS-fc$FEDORA
          cat SHA256SUMS-fc$FEDORA

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files="cdh-fc$FEDORA-x86_64.tar.gz cloud-desktop-host-fc$FEDORA-x86_64 MANIFEST-fc$FEDORA SHA256SUMS-fc$FEDORA"
          # matrix jobs run in parallel: whoever is first creates the release, the others upload
          gh release create "$GITHUB_REF_NAME" $files --generate-notes 2>/dev/null \
            || gh release upload "$GITHUB_REF_NAME" $files --clobber

      - name: Keep artifacts (manual runs)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: cdh-fc${{ env.FEDORA }}-x86_64
          path: |
            cdh-fc${{ env.FEDORA }}-x86_64.tar.gz
            MANIFEST-fc${{ env.FEDORA }}
            SHA256SUMS-fc${{ env.FEDORA }}
