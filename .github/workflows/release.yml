# Push a tag like v0.1.0 → builds the CT bundle and attaches it to a GitHub release.
# One matrix job per Fedora release builds its fcNN binary + bundle; a final job (only if all builds
# succeeded) writes the single MANIFEST + SHA256SUMS and creates the release — no partial releases.
# Asset names carry no version, so .../releases/latest/download/<name> always works.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        fedora: ["43", "44", "45"]   # keep in sync with SUPPORTED_FEDORA in pve/install-parts/10-config.sh
    env:
      FEDORA: ${{ matrix.fedora }}
    steps:
      - uses: actions/checkout@v4

      - name: Check pve/install.sh is built from pve/install-parts
        run: pve/build.sh --check

      - name: Fetch wlroots submodule only
        run: git submodule update --init --depth 1 subprojects/wlroots

      - name: Build binary (Fedora ${{ env.FEDORA }}, static wlroots)
        run: docker build --build-arg FEDORA=$FEDORA -o dist .

      - name: Package
        run: |
          mkdir -p pkg/cdh/pve dist
          cp dist/cloud-desktop-host pkg/cdh/
          cp -r scripts configs pkg/cdh/
          cp pve/install.sh pve/host-persist.sh pkg/cdh/pve/
          tar -C pkg -czf dist/cdh-fc$FEDORA-x86_64.tar.gz cdh
          mv dist/cloud-desktop-host dist/cloud-desktop-host-fc$FEDORA-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: build-fc${{ matrix.fedora }}
          path: dist/*
          if-no-files-found: error

  # runs only if every build succeeded: one MANIFEST, one SHA256SUMS, one release
  release:
    needs: build
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: build-fc*
          merge-multiple: true

      - name: Checksums
        run: |
          # MANIFEST (used by `install.sh --check`): one binary line per Fedora, plus the scripts/configs
          # shared by all of them. install.sh picks its own cloud-desktop-host-fcNN-x86_64 line.
          { (cd dist && sha256sum cloud-desktop-host-fc*-x86_64)
            sha256sum $(find scripts configs -type f | sort)
          } > dist/MANIFEST
          (cd dist && sha256sum cdh-fc*-x86_64.tar.gz cloud-desktop-host-fc*-x86_64 MANIFEST > SHA256SUMS && cat SHA256SUMS)

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
